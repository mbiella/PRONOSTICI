{% extends "base.html" %}
{% block title %}Nuova Giornata{% endblock %}
{% block content %}
<div style="margin-bottom:1rem;"><a href="{{ url_for('admin_dashboard') }}" style="color:#555; font-size:0.8rem; font-family:var(--font-mono);">← Dashboard</a></div>
<div class="page-title">Nuova <span class="accent">Giornata</span></div>
<div class="page-subtitle">// crea una nuova giornata di pronostici</div>

<div class="card" style="max-width:500px;">
  <form method="POST">
    <div class="form-group">
      <label class="form-label">Nome Giornata</label>
      <input class="form-input" type="text" name="nome" placeholder="Es: Giornata 1 — Serie A" required autofocus>
    </div>
    <div class="form-group">
      <label class="form-label">Data</label>
      <input class="form-input" type="date" name="data" value="{{ oggi }}" required>
    </div>
    <div style="display:flex; gap:0.8rem; margin-top:1.5rem;">
      <button type="submit" class="btn btn-primary">✅ Crea Giornata</button>
      <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Annulla</a>
    </div>
  </form>
</div>
{% endblock %}
