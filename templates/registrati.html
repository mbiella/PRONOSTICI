<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toto Mondiali 2026 — Registrati</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --nero: #0a0a0a; --verde: #00e676; --oro: #ffd600;
  --bianco: #f5f5f0; --grigio: #1a1a1a; --grigio2: #2a2a2a;
  --grigio3: #3a3a3a; --testo: #d4d4cc; --rosso: #ff1744;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--nero); color: var(--testo); font-family: 'DM Sans', sans-serif;
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background: radial-gradient(ellipse 60% 40% at 50% 50%, rgba(0,230,118,0.04) 0%, transparent 70%),
    repeating-linear-gradient(90deg, transparent, transparent 49px, rgba(0,230,118,0.03) 49px, rgba(0,230,118,0.03) 50px),
    repeating-linear-gradient(0deg, transparent, transparent 49px, rgba(0,230,118,0.03) 49px, rgba(0,230,118,0.03) 50px);
  pointer-events: none;
}
.wrap { width: 100%; max-width: 420px; padding: 1.5rem; position: relative; z-index: 1; }
.brand { font-family: 'Bebas Neue', sans-serif; font-size: 3.5rem; letter-spacing: 6px; color: var(--verde); text-align: center; line-height: 1; margin-bottom: 0.3rem; }
.brand span { color: var(--oro); }
.tagline { text-align: center; font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase; color: #555; margin-bottom: 2.5rem; }
.box { background: var(--grigio); border: 1px solid var(--grigio3); border-radius: 12px; padding: 2rem; }
.box h2 { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 3px; color: var(--bianco); margin-bottom: 1.5rem; }
.alert { padding: 0.8rem 1rem; border-radius: 6px; margin-bottom: 1.2rem; font-size: 0.85rem; }
.alert-error { background: rgba(255,23,68,0.1); border-left: 3px solid var(--rosso); color: #ff6b6b; }
.form-group { margin-bottom: 1.2rem; }
label { display: block; font-size: 0.75rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #666; margin-bottom: 0.4rem; }
input { width: 100%; background: var(--grigio2); border: 1px solid var(--grigio3); border-radius: 6px; padding: 0.7rem 0.9rem; color: var(--bianco); font-size: 0.95rem; font-family: 'DM Sans', sans-serif; transition: border-color 0.2s; }
input:focus { outline: none; border-color: var(--verde); }
.btn-submit { width: 100%; background: var(--oro); color: var(--nero); border: none; border-radius: 6px; padding: 0.8rem; font-size: 0.9rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; margin-top: 0.5rem; }
.btn-submit:hover { background: #f9a825; transform: translateY(-1px); }
.divider { text-align: center; margin: 1.2rem 0; color: #444; font-size: 0.8rem; }
.link { display: block; text-align: center; color: #666; font-size: 0.85rem; transition: color 0.2s; }
.link:hover { color: var(--verde); }
.link strong { color: var(--testo); }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Toto Mondiali <span>2026</span></div>
  <div class="tagline">Pronostici Calcio</div>
  <div class="box">
    <h2>Crea Account</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" autofocus required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn-submit">🏆 Registrati</button>
    </form>
    <div class="divider">— oppure —</div>
    <a href="/login" class="link">Hai già un account? <strong>Accedi</strong></a>
  </div>
</div>
</body>
</html>
